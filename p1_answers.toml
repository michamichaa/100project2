# 16.100 Aerodynamics, Fall 2026 -- Project 1 answer file
#
# Submit this file on Canvas together with your PDF report.
#
# Rules
#   * Replace every nan with your number, and fill in [team].
#     A nan left in the file counts as a missing answer.
#   * Numbers only: no units, no formulas, no quotes. The unit is in the key name.
#   * SI units exactly as named (m, kg, N, W, m/s). Times in minutes, range in km.
#   * Do not rename or delete keys. Add Task 2 rows by copying a row line.
#
# Before you submit, check the format with the validator from Canvas
# (Python 3.11 or later):
#   python validate_p1_answers.py p1_answers.toml

format = "16.100-P1-v1"

[team]
group = 0                                      # your group number
members = ["First Last", "First Last", "First Last"]

# ---------------------------------------------------------------------------
# Task 2 -- your table, one row per line (at least three wing areas, three
# aspect ratios and three battery masses). Keep each row on ONE line.
# ---------------------------------------------------------------------------
[task2]
rows = [
  {area_m2 = nan, aspect_ratio = nan, battery_mass_kg = nan, span_m = nan, chord_m = nan, wing_mass_kg = nan, fuselage_mass_kg = nan, total_mass_kg = nan, wing_loading_N_per_m2 = nan, V_stall_m_per_s = nan},
  {area_m2 = nan, aspect_ratio = nan, battery_mass_kg = nan, span_m = nan, chord_m = nan, wing_mass_kg = nan, fuselage_mass_kg = nan, total_mass_kg = nan, wing_loading_N_per_m2 = nan, V_stall_m_per_s = nan},
]

# Task 2 -- the wing area and aspect ratio that give the lowest stall speed
# with span <= 1.6 m, for the battery mass you choose here
[task2_min_stall]
battery_mass_kg = nan
area_m2 = nan
aspect_ratio = nan
V_stall_m_per_s = nan

# ---------------------------------------------------------------------------
# Task 3 -- your design point
# ---------------------------------------------------------------------------
[design]
# your choices
area_m2 = nan
aspect_ratio = nan
battery_mass_kg = nan
cruise_speed_m_per_s = nan
# what follows from them
span_m = nan
chord_m = nan
wing_mass_kg = nan
fuselage_mass_kg = nan            # without the battery and the payload
total_mass_kg = nan
wing_loading_N_per_m2 = nan
V_stall_m_per_s = nan
CL_cruise = nan
LD_cruise = nan                   # L/D at YOUR cruise C_L, not the maximum L/D
battery_power_W = nan             # power drawn from the battery at cruise
range_km = nan                    # at your cruise speed; must be >= 22 km (20 km + 10% reserve)
flight_time_min = nan             # 20 km at your cruise speed
Reynolds_cruise = nan             # V c / nu

# ---------------------------------------------------------------------------
# Task 5
# ---------------------------------------------------------------------------
[task5]
CLmax_required = nan              # the C_Lmax your wing must reach, including your margin
